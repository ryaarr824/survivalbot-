name: build
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -q survivorbot-mod.zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - run: cd survivorbot && chmod +x gradlew && ./gradlew build
      - uses: actions/upload-artifact@v4
        with:
          name: survivorbot-jar
          path: survivorbot/build/libs/survivorbot-1.0.0.jar
